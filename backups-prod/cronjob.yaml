apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-cronjob
spec:
  schedule: 0 1 * * *
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          containers:
          - name: postgres-backup
            image: docker.io/jaffleman971/postgres-backup:1.1
            command:
            - /bin/sh
            - /scripts/backup.sh
            env:
            - name: PGHOST
              value: maptdp-db
            - name: PGPORT
              value: '5432'
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: maptdp-db-auth
                  key: user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: maptdp-db-auth
                  key: password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: postgres-s3-auth
                  key: access_key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: postgres-s3-auth
                  key: secret_key
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: postgres-s3-auth
                  key: region
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: postgres-s3-auth
                  key: bucket
            - name: S3_PREFIX
              valueFrom:
                secretKeyRef:
                  name: postgres-s3-auth
                  key: prefix
            volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
          volumes:
          - name: scripts
            configMap:
              name: postgres-backup-scripts
