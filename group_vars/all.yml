# V3 - Correctifs TECH-01 (audit du 2026-10-23)
# Constat C6 : ssh_user était utilisé par les rôles security et
# k3s_server sans être défini nulle part dans le dépôt (aucun
# group_vars) -> le playbook échouait tel que commité.
# Ce fichier centralise les variables communes à tous les hôtes.

# Utilisateur distant et utilisateur kubectl
ssh_user: ubuntu
kube_user: "{{ ssh_user }}"

# Port SSH durci (l'inventaire fixe ansible_port par hôte)
ssh_port: 63210

# Kubeconfig utilisateur (copie en 0600 pour {{ kube_user }}).
# Le kubeconfig serveur /etc/rancher/k3s/k3s.yaml reste en 0600 root.
kubeconfig_path: "/home/{{ ssh_user }}/.kube/config"

# IP Tailscale du control-plane (vps-2a962a39). Depuis la V3, l'API
# Kubernetes (6443) n'est joignable QUE via le tailnet.
# ATTENTION PRA : un VPS1 réinstallé peut recevoir une autre IP au
# ré-enrôlement ; le rôle tailscale_ufw met à jour cette valeur pour
# le run en cours — ajuster ce fichier si l'IP change définitivement.
k3s_control_plane_ip: "100.89.84.16"

# fail2ban : IP admin à ajouter ponctuellement via
#   -e fail2ban_ignoreip="127.0.0.1/8 ::1 86.246.10.119"
fail2ban_ignoreip: "127.0.0.1/8 ::1"
