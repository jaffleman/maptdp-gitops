- name: Bootstrap Kubernetes + ArgoCD + Vault integration
  hosts: k3s_servers
  become: true
  # V3 (TECH-01) :
  #   - ciblage k3s_servers uniquement (le worker a son propre
  #     playbook k3s_worker.yml) ;
  #   - suppression du var kubeconfig_path = /etc/rancher/k3s/k3s.yaml
  #     qui rendait la copie kubeconfig du rôle k3s_server inopérante
  #     (src = dest) — la valeur vient de group_vars/all.yml.
  any_errors_fatal: true

  # -------------------------
  # PRE-TASKS (robuste)
  # -------------------------

  pre_tasks:

    # 27/10 : convention de nommage reseau (vps-cp / vps-worker /
    # vault / msi-admin). Le hostname est pose AVANT l'enrolement
    # Tailscale et l'installation k3s : le nom MagicDNS Tailscale et
    # le nom de noeud k3s en heritent.
    - name: Définir le hostname du nœud (convention de nommage 27/10)
      ansible.builtin.hostname:
        name: "{{ node_hostname }}"

    - name: Wait for apt lock to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          echo "Waiting for apt lock..."
          sleep 5
        done
      changed_when: false

    - name: Ensure python3-venv is installed
      ansible.builtin.apt:
        name: python3-venv
        state: present
        update_cache: yes
        lock_timeout: 300
      register: apt_result
      retries: 5
      delay: 15
      until: apt_result is succeeded

    - name: Create virtualenv for Ansible
      ansible.builtin.command:
        cmd: python3 -m venv /opt/ansible-venv
      args:
        creates: /opt/ansible-venv/bin/python

    - name: Set ansible Python interpreter
      ansible.builtin.set_fact:
        ansible_python_interpreter: /opt/ansible-venv/bin/python

# -------------------------
# ROLES (ORDRE PROPRE)
# -------------------------

  roles:

    # 🔐 Security baseline
    - { role: security, tags: [security] }

    # 🐍 Runtime (pip / k8s modules) — DOIT PASSER AVANT TOUT LE RESTE
    - { role: python_prereqs, tags: [runtime] }

    # ⚙️ Kubernetes infra
    - { role: k3s_prereqs, tags: [k3s] }
    - { role: k3s_server, tags: [k3s] }

    # 🔒 V3 : enrôlement Tailscale + validation via le tailnet +
    # fermeture publique de 6443/10250/8472. Doit passer APRÈS
    # k3s_server (kubeconfig à basculer) et AVANT Vault/VSO
    # (kubernetes_host = IP Tailscale).
    - { role: tailscale_ufw, tags: [tailscale, k3s] }

    # 🧑‍🤝‍🧑 Vault - 1. contact et configuration de base
    - { role: vault_first_contact, tags: [vault] }

    # 📦 Tooling
    - { role: helm, tags: [helm] }

    # 🔐 installation de vault secret operator
    - { role: vault_secret_operator, tags: [vault] }

    # 2. gestion - role: liaison et création du secret applicatif
    # - {role: vso_app_sync, tags: [vault, app_sync]}
    - {role: vso_argocd_sync, tags: [argocd, app_sync]}
    # - {role: vso_grafana_sync, tags: [grafana, app_sync]}

    # 🌐 Ingress Controller
    - { role: traefik_ingress, tags: [networking] }

    # 🔐 TLS Management
    - { role: cert_manager, tags: [tls] }
    - { role: cert_manager_issuers, tags: [tls] }

    # 🚀 GitOps Controller
    - { role: argocd, tags: [gitops] }

    # 🔥 FUTUR
    - { role: argocd_bootstrapv2, tags: [gitops, bootstrap] }
