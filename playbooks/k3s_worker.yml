# V5 (29/10) — PHASE 2 WORKER : déploiement de l'agent k3s VIA LE TAILNET.
# Prérequis : PHASE 1 terminée (playbooks/prepare_vps.yml) — VPS durci
# (sshd 63210, UFW, fail2ban) et enrôlé sur le tailnet.
# C13 : adresses dans l’inventaire ; aucun token ni ansible_host en extra-vars.
# Le rôle crée un bootstrap TTL sur le CP, puis le révoque après enrôlement.
# Ne jamais transférer le token serveur au worker.
- name: Phase 2 - Déploiement de l'agent k3s (worker, via tailnet)
  hosts: k3s_workers
  become: true
  any_errors_fatal: true

  pre_tasks:

    - name: "C03/C13 - Vérifier les variables non secrètes (worker)"
      ansible.builtin.assert:
        that:
          - k3s_token is not defined
          - k3s_control_plane_ip is defined
          - ansible_host is defined
          - k3s_node_name is defined
          - groups['k3s_servers'] | length == 1
        fail_msg: >-
          Utiliser l'inventaire à jour, sans k3s_token ni ansible_host en extra-vars.
          Le bootstrap temporaire est créé sur le CP par le rôle C13.
        success_msg: "C03/C13 - Paramètres worker présents, aucun token serveur fourni."

    - name: "C10 - Attendre les verrous APT avec une échéance"
      ansible.builtin.import_role:
        name: readiness_wait
      vars:
        readiness_kind: apt
        readiness_timeout: "{{ readiness_apt_timeout }}"
      tags: [apt_wait]

    - name: Ensure python3-venv is installed
      ansible.builtin.apt:
        name: python3-venv
        state: present
        update_cache: yes
        lock_timeout: 300
      register: apt_result
      retries: 5
      delay: 15
      until: apt_result is succeeded

    - name: Create virtualenv for Ansible
      ansible.builtin.command:
        cmd: python3 -m venv /opt/ansible-venv
      args:
        creates: /opt/ansible-venv/bin/python

    - name: Set ansible Python interpreter
      ansible.builtin.set_fact:
        ansible_python_interpreter: /opt/ansible-venv/bin/python

  roles:

    # 🐍 Runtime (pip / k8s modules)
    - { role: python_prereqs, tags: [runtime] }

    # ⚙️ Pré-requis (aucun port cluster au public)
    - { role: k3s_prereqs, tags: [k3s] }

    # 🧩 Agent k3s (bootstrap temporaire C13) — rejoint le control-plane
    # via le tailnet (node-ip + flannel-iface dans config.yaml)
    - { role: k3s_worker, tags: [k3s] }


