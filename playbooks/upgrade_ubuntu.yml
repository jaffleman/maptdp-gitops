- name: Upgrade Ubuntu vers une version supportée
  hosts: all
  become: true
  become_method: sudo
  serial: 1   # ✅ rolling upgrade (1 serveur à la fois)

  vars:
    release_upgrade_params: "-f DistUpgradeViewNonInteractive"

  tasks:
    - name: Vérifier la version Ubuntu
      command: lsb_release -a
      register: ubuntu_version
      changed_when: false

    - name: Afficher la version actuelle
      debug:
        msg: "{{ ubuntu_version.stdout_lines }}"

    - name: S'assurer que le système est à jour
      apt:
        update_cache: true
        upgrade: dist

    - name: Installer update-manager-core
      apt:
        name: update-manager-core
        state: present

    - name: Lancer do-release-upgrade en mode non interactif
      command: do-release-upgrade {{ release_upgrade_params }}
      async: 7200            # jusqu'à 2h si nécessaire
      poll: 0
      register: upgrade_job

    - name: Attendre la fin de l'upgrade
      async_status:
        jid: "{{ upgrade_job.ansible_job_id }}"
      register: upgrade_status
      until: upgrade_status.finished
      retries: 300
      delay: 30

    - name: Nettoyage APT post-upgrade
      apt:
        autoremove: true
        autoclean: true