# V5 (29/10) — PHASE 1 : préparation et durcissement d'un VPS.
# V5.1 : la finalisation (fermeture 22 + bascule systemd + reboot) est
#        regroupée dans UNE SEULE tâche atomique fire-and-forget :
#        après la suppression du filet 22, TOUTE tâche distante
#        ultérieure est vouée à l'UNREACHABLE (UFW bloque 22, sshd pas
#        encore basculé). V5 avait laissé 5 tâches après le filet ->
#        lockout. V5.1 n'en laisse plus AUCUNE.
# V5.2 : la finalisation est conditionnée à l'état EFFECTIF de sshd
#        (écoute-t-il sur {{ ssh_port }} ?) et non au seul changement
#        de config. Un run interrompu après écriture du sshd_config
#        mais AVANT finalisation doit reprendre proprement : au re-run,
#        ssh_port_change n'est plus "changed", et l'ancien
#        conditionnement aurait SAUTÉ la bascule silencieusement
#        (machine bloquée sur le port 22 sans aucun échec).
# RÉUTILISABLE pour le control-plane ET le worker (hosts: k3s_nodes).
# Machine fraîche (SSH 22)      : -e bootstrap_ssh=22 -l <hote>
#                                -e ansible_host=<IP publique> -e tailscale_auth_key=tskey-…
# Machine déjà durcie (63210)  : ne rien passer (re-run idempotent,
#                                pas de reboot si sshd est déjà basculé)
# La phase 1 se termine par un reboot FIRE-AND-FORGET : c'est le BOOT
# qui bascule sshd sur {{ ssh_port }} (config écrite par le rôle
# security) — aucune reconnexion Ansible n'est tentée après. Les
# validations finales sont 100% LOCALES (wait_for depuis le MSI).
# La PHASE 2 se connecte VIA LE TAILNET :
#   worker : playbooks/k3s_worker.yml
#   CP     : playbooks/k3s_platform.yml
- name: Phase 1 - Préparation et durcissement d'un VPS (CP + worker)
  hosts: k3s_nodes
  become: true
  any_errors_fatal: true

  pre_tasks:

    - name: Définir le hostname du nœud (convention de nommage 27/10)
      ansible.builtin.hostname:
        name: "{{ node_hostname }}"

    - name: Wait for apt lock to be released
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          echo "Waiting for apt lock..."
          sleep 5
        done
      changed_when: false

    - name: Ensure python3-venv is installed
      ansible.builtin.apt:
        name: python3-venv
        state: present
        update_cache: yes
        lock_timeout: 300
      register: apt_result
      retries: 5
      delay: 15
      until: apt_result is succeeded

    - name: Create virtualenv for Ansible
      ansible.builtin.command:
        cmd: python3 -m venv /opt/ansible-venv
      args:
        creates: /opt/ansible-venv/bin/python

    - name: Set ansible Python interpreter
      ansible.builtin.set_fact:
        ansible_python_interpreter: /opt/ansible-venv/bin/python

  roles:

    # 🔐 Durcissement : sshd_config (Port 63210 écrit, effet au reboot),
    # UFW (63210+limit, 80/443, filet 22 temporaire), fail2ban.
    - { role: security, tags: [security] }

    # 🐍 Enrôlement Tailscale + fermeture publique 6443/10250/8472.
    - { role: tailscale_ufw, tags: [tailscale] }

  post_tasks:

    # -------------------------
    # V5.2 : état EFFECTIF de sshd — la finalisation n'a lieu QUE si
    # sshd n'écoute pas encore sur {{ ssh_port }}. Couvre à la fois la
    # machine fraîche (bascule de port) et la reprise après un run
    # interrompu entre écriture du config et finalisation.
    # -------------------------

    - name: Vérifier si sshd écoute déjà sur {{ ssh_port }}
      ansible.builtin.shell: "ss -tln | grep ':{{ ssh_port }} '"
      register: sshd_port_check
      failed_when: false
      changed_when: false

    # -------------------------
    # FINALISATION ATOMIQUE (V5.1) — UNE SEULE commande, UNE SEULE
    # connexion SSH, plus AUCUNE tâche distante après.
    # Ordre sûr : deny 22 d'abord (l'autorisation existante prime
    # encore), bascule systemd, PUIS suppression du filet en dernier,
    # juste avant le reboot. Le boot applique Port {{ ssh_port }}.
    # -------------------------

    - name: Fermer le 22, préparer le boot sur {{ ssh_port }} et rebooter (atomique, fire-and-forget)
      ansible.builtin.shell: |
        set -x
        # Le boot appliquera Port {{ ssh_port }} (config déjà écrite)
        systemctl enable ssh.service
        systemctl disable --now ssh.socket || true
        systemctl daemon-reload
        # Deny d'abord : tant que le filet allow existe, il prime
        ufw deny 22/tcp comment 'SSH legacy - ferme definitivement' || true
        # Suppression du filet : à partir d'ICI le port 22 est mort,
        # mais cette session shell se termine ligne suivante.
        ufw delete allow 22/tcp || true
        # Reboot fire-and-forget
        nohup /sbin/reboot >/dev/null 2>&1 &
      args:
        executable: /bin/bash
      async: 1
      poll: 0
      ignore_unreachable: true
      ignore_errors: true
      when: sshd_port_check.rc != 0

    # -------------------------
    # VALIDATIONS 100% LOCALES (depuis le MSI)
    # -------------------------

    - name: Attendre le retour du VPS sur le port {{ ssh_port }} (IP publique)
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ ssh_port }}"
        delay: 30
        timeout: 600
        state: started
        search_regex: OpenSSH
      delegate_to: localhost
      become: false
      when: sshd_port_check.rc != 0

    - name: Attendre le retour du VPS sur le tailnet (port {{ ssh_port }})
      ansible.builtin.wait_for:
        host: "{{ tailscale_ip.stdout | trim }}"
        port: "{{ ssh_port }}"
        delay: 10
        timeout: 300
        state: started
        search_regex: OpenSSH
      delegate_to: localhost
      become: false
      when: sshd_port_check.rc != 0

    - name: Phase 1 terminée — instructions pour la phase 2
      ansible.builtin.debug:
        msg: >-
          VPS durci (sshd {{ ssh_port }}, UFW, fail2ban), enrôlé sur le
          tailnet, rebooté. PHASE 2 : lancer le playbook de déploiement
          avec -e ansible_host={{ tailscale_ip.stdout | trim }}
          (connexion via tailnet, port {{ ssh_port }} par défaut).
      delegate_to: localhost
