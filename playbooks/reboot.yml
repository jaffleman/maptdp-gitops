- name: Reboot contrôlé des serveurs Ubuntu
  hosts: all
  become: true
  become_method: sudo
  serial: 5     # ✅ prêt pour 100 serveurs

  tasks:
    - name: Vérifier si un reboot est requis
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot si nécessaire
      reboot:
        msg: "Reboot après upgrade Ubuntu"
        reboot_timeout: 900
        connect_timeout: 10
      when: reboot_required.stat.exists