apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 37.1.1

    helm:
      values: |
        deployment:
          replicas: 2

        service:
          enabled: true
          type: LoadBalancer

          annotations:
            service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
            service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"

        ingressClass:
          enabled: true
          isDefaultClass: true
          name: traefik

        providers:
          kubernetesIngress:
            enabled: true

          kubernetesCRD:
            enabled: true

        ports:
          web:
            port: 80
            expose:
              default: true

          websecure:
            port: 443
            expose:
              default: true

        logs:
          general:
            level: INFO

        additionalArguments:
          - "--api.dashboard=true"

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
