apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret

metadata:
  name: monitoring-secret-sync
  namespace: monitoring

spec:
  vaultAuthRef: vault-jwt-auth

  mount: kv_aws
  path: maptdp/prod/grafana-creds
  type: kv-v2

  refreshInterval: 5m

  destination:
    name: monitoring-auth
    create: true
