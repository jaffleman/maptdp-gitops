apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: step3-apps
  namespace: argocd
  annotations:
    argocd.openshift.io/sync-wave: "3" 
spec:
  project: default
  source:
    repoURL: 'https://github.com/jaffleman/maptdp-gitops.git'
    targetRevision: bootstrap-infra
    path: apps/prod/infra/apps
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: bootstrap
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true