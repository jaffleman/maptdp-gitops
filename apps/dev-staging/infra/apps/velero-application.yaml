apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 7.1.3

    helm:
      values: |
        kubectl:
          image:
            repository: rancher/kubectl
            tag: v1.36.2

        credentials:
          existingSecret: velero-s3-auth

        serviceAccount:
          server:
            create: false
            name: vso-velero-sa

        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: maptdp-database-489575506572-eu-west-3-an
              prefix: k3s-cluster-backup
              default: true
              config:
                region: eu-west-3

          defaultBackupStorageLocation: default
          defaultVolumesToFsBackup: true

        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.10.0
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - mountPath: /target
                name: plugins

        schedules:
          daily-backup:
            schedule: "0 2 * * *"
            template:
              ttl: "240h"
              storageLocation: default
              includedNamespaces:
                - "*"
              snapshotVolumes: false
              defaultVolumesToFsBackup: true

  destination:
    server: https://kubernetes.default.svc
    namespace: velero

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true