apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 7.1.3

    helm:
      values: |
        credentials:
          existingSecret: velero-s3-auth

        serviceAccount:
          server:
            create: false
            name: vso-velero-sa

        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: maptdp-database-489575506572-eu-west-3-an
              prefix: k3s-cluster-backup
              config:
                region: eu-west-3

        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.10.0
            volumeMounts:
              - mountPath: /target
                name: plugins

  destination:
    server: https://kubernetes.default.svc
    namespace: velero

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true