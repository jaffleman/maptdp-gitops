apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: appflowy-preprod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jaffleman/maptdp-gitops.git
    targetRevision: bootstrap-infra
    path: charts/appflowy
    helm:
      releaseName: appflowy-preprod
      valueFiles:
      - values-preprod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: appflowy-preprod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
