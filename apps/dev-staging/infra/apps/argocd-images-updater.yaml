apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "6"

spec:
  project: default

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: "0.12.2"

    helm:
      valuesObject:
        replicaCount: 1

        config:
          logLevel: info

          argocd:
            grpcWeb: true
            serverAddress: "argocd.dev-staging.jaffleman.tech"
            insecure: true
            plaintext: true

          registries:
            - name: Docker Hub
              prefix: docker.io
              api_url: https://registry-1.docker.io
              credentials: secret:argocd/dockerhub-creds#auth
              default: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true

      