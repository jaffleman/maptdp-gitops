apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maptdp-db-staging
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https://github.com/jaffleman/maptdp-gitops.git
    targetRevision: staging
    path: apps/charts/maptdp-db
  destination:
    server: https://kubernetes.default.svc
    namespace: maptdp-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - CreateNamespace=true