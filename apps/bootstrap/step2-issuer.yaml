apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: step2-issuer
  namespace: argocd
  annotations:
    argocd.openshift.io/sync-wave: "2" 
spec:
  project: default
  source:
    repoURL: 'https://github.com/jaffleman/New_MapTdp.git'
    targetRevision: main
    path: deploy/apps/infra/user-services
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: bootstrap
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true