apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: step4-maptdp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/jaffleman/maptdp-gitops.git'
    path: apps/maptdp-apps
    targetRevision: dev

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: bootstrap
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true