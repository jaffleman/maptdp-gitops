apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-appv2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jaffleman/maptdp-gitops.git
    targetRevision: bootstrap-infra
    path: apps/dev-staging/bootstrap-infra
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: rootapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true