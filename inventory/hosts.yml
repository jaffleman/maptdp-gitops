# V3 - Correctifs TECH-01 (audit du 2026-10-23)
# - Groupes séparés k3s_servers / k3s_workers : k3s_platform.yml ne
#   cible que le control-plane ; le worker a son propre playbook
#   k3s_worker.yml (l'enrôlement PREUVE-012 n'était pas industrialisé).
#
# 27/10/2026 — CONVENTION DE NOMMAGE RÉSEAU (validée) :
#   hostname système = nom Tailscale (MagicDNS) = nom de nœud k3s :
#     - vps-ovh1 (control-plane) -> vps-cp
#     - vps-ovh2 (worker)         -> vps-worker
#     - VM Vault (Freebox)        -> vault
#     - laptop admin (MSI)        -> msi-admin
#   Les pre-tasks des playbooks posent le hostname AVANT l'enrôlement
#   Tailscale et l'installation k3s. Minuscules + tirets uniquement
#   (contrainte k8s / MagicDNS).
#
# V5 (29/10) — SCISSION EN 2 PHASES, ansible_port TEMPLATISÉ :
#   ansible_port: "{{ bootstrap_ssh | default(63210) }}"
#
#   PHASE 1 — playbooks/prepare_vps.yml (réutilisable CP + worker),
#   connexion sur l'IP PUBLIQUE en machine fraîche :
#     ansible-playbook playbooks/prepare_vps.yml -l <hôte> \
#       -e bootstrap_ssh=22 \
#       -e tailscale_auth_key=tskey-auth-…
#     Durcissement (sshd, UFW, fail2ban) + hostname + enrôlement
#     Tailscale, PUIS reboot fire-and-forget : la bascule sshd
#     22 -> 63210 est APPLIQUÉE AU BOOT (config écrite avant), aucune
#     reconnexion Ansible après le reboot. Les validations finales
#     (wait_for port 63210 public + tailnet) sont 100% LOCALES.
#     En phase 1, l'extra-var ansible_host=<IP publique> est SÛRE :
#     prepare_vps.yml ne délègue jamais vers un autre hôte.
#
#   PHASE 2 — connexion VIA LE TAILNET (port 63210 par défaut).
#   ⚠️ RÈGLE (leçon du 29/10) : METTRE À JOUR ansible_host dans
#   l'inventaire APRÈS chaque phase 1, puis lancer SANS extra-var
#   ansible_host. Les extra-vars sont GLOBALES : -e ansible_host=X
#   écrase l'adresse de TOUS les hôtes d'inventaire — le
#   delegate_to vps-ovh1 du rôle k3s_worker pointait alors sur le
#   worker lui-même (kubectl d'un agent -> localhost:8080 refusé).
#     worker : ansible-playbook playbooks/k3s_worker.yml -l vps-ovh2 \
#                -e k3s_token=K10…
#     CP     : ansible-playbook playbooks/k3s_platform.yml -l vps-ovh1 \
#                (+ AppRole Vault)
#     Le rôle k3s_server redécouvre l'IP Tailscale effective et fait
#     autorité sur k3s_control_plane_ip (PRA) : pas besoin d'éditer
#     les group_vars avant le run.
#
#   Re-runs idempotents : ne rien passer (port 63210, pas de reboot —
#   V5.3 referme le 22 résiduel du ufw reset du rôle security).
#   (L'ancienne approche -e ansible_port=22 neutralisait le set_fact
#   du rôle security : précédence maximale des extra-vars — échec
#   UNREACHABLE garanti après la bascule sshd.)
#
# Worker vps-ovh2 : REBUILD phase 1 le 29/10/2026 (test de
# redéploiement complet, run one-shot vert : ok=49 changed=28
# failed=0 unreachable=0 ; re-run idempotence : ok=49 changed=14
# skipped=5 failed=0, sans reboot). ansible_host = nouvelle IP
# Tailscale issue du ré-enrôlement (l'ancienne 100.122.55.71 est
# morte avec lui). Les IP Tailscale CHANGENT à chaque
# ré-enrôlement : mettre à jour ansible_host à ce moment ;
# k3s_control_plane_ip (group_vars) ne change que si le CP est
# re-enrôlé (le rôle k3s_server redécouvre seul l'IP effective en
# PRA).
# ATTENTION : ne JAMAIS runner le tag security SEUL sur un nœud —
# son "UFW reset" effacerait les règles tailscale0 et recréerait la
# partition CP<->worker de l'incident du 20/10 (les rôles suivants
# les reposent).

all:
  children:
    k3s_servers:
      hosts:
        vps-ovh1:
          ansible_host: 146.59.231.136
          ansible_user: ubuntu
          ansible_port: "{{ bootstrap_ssh | default(63210) }}"
          node_hostname: vps-cp
    k3s_workers:
      hosts:
        vps-ovh2:
          ansible_host: 100.108.33.59
          ansible_user: ubuntu
          ansible_port: "{{ bootstrap_ssh | default(63210) }}"
          node_hostname: vps-worker
          k3s_node_name: vps-worker
    k3s_nodes:
      children:
        k3s_servers:
        k3s_workers:
