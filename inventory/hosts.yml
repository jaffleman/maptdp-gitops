# V3 - Correctifs TECH-01 (audit du 2026-10-23)
# - Groupes séparés k3s_servers / k3s_workers : k3s_platform.yml ne
#   cible que le control-plane ; le worker a son propre playbook
#   k3s_worker.yml (l'enrôlement PREUVE-012 n'était pas industrialisé).
# - vps-ovh2 actif avec k3s_node_name: vps-2 (nom de nœud historique
#   conservé, cf. PREUVE-012).
#
# ŒUF ET POULE SSH : vps-ovh1 est durci en production (port 63210).
# Après une réinstallation PRA (clean_vps), SSH revient au port 22 :
# lancer le premier run avec -e ansible_port=22, puis l'option devient
# inutile (l'inventaire reprend le relais).
#
# Worker vps-ovh2 (état constaté le 25/10/2026, incident
# CHG-2026-10-20-TAILNET-VSO) : UFW durci le 25/10 soir (22/6443/10250/
# 8472 fermés au public, tailscale0 ouvert) MAIS le durcissement SSH
# n'a jamais été appliqué : sshd écoute sur le port 22. Conséquence :
# SSH public doublement mort (22 denied, 63210 sans écoute) ->
# l'administration du worker passe par le tailnet uniquement.
# ansible_host = IP Tailscale du worker.
# Fin du durcissement = run COMPLET du playbook k3s_worker.yml :
#   ansible-playbook playbooks/k3s_worker.yml \
#     -e ansible_port=22 \
#     -e tailscale_auth_key=tskey-auth-xxxx \
#     -e k3s_token=K10xxxxxxxx
# Le rôle security fait la bascule sshd vers 63210 (+ reboot), les
# rôles tailscale_ufw et k3s_worker sont idempotents (nœud déjà
# enrôlé, config.yaml conforme).
# ATTENTION : ne JAMAIS runner le tag security SEUL sur ce nœud —
# son "UFW reset" effacerait les règles tailscale0 et recréerait la
# partition CP<->worker de l'incident du 20/10.

all:
  children:
    k3s_servers:
      hosts:
        vps-ovh1:
          ansible_host: 146.59.231.136
          ansible_user: ubuntu
          ansible_port: 63210
    k3s_workers:
      hosts:
        vps-ovh2:
          ansible_host: 100.122.55.71
          ansible_user: ubuntu
          # Durcissement SSH (rôle security) pas encore appliqué au
          # worker : sshd écoute sur 22, joignable via le tailnet.
          # Décommenter après le run complet de k3s_worker.yml :
          # ansible_port: 63210
          k3s_node_name: vps-2
    k3s_nodes:
      children:
        k3s_servers:
        k3s_workers:
