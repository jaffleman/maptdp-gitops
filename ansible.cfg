[defaults]
inventory = inventory/hosts.yml
remote_user = jaffleman
# V3 (TECH-01, constat C5) : host_key_checking=False acceptait
# silencieusement toute clé serveur (risque MITM, et masquait les
# vrais problèmes de clés). accept-new : accepte la clé au premier
# contact, refuse toute divergence ensuite.
# ATTENTION PRA : après réinstallation d'un VPS, purger l'ancienne
# entrée avant le premier run, sinon la connexion est refusée :
#   ssh-keygen -f ~/.ssh/known_hosts -R "[146.59.231.136]:22"
host_key_checking = accept-new
retry_files_enabled = False
interpreter_python = auto_silent
roles_path = roles
collections_path = ~/.ansible/collections:/usr/share/ansible/collections

[ssh_connection]
pipelining = True
ssh_args = -o IdentityFile=~/.ssh/ansible_ed25519
