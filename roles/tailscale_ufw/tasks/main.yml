# V5 (29/10) — Rôle de PHASE 1 (prepare_vps.yml), réutilisable CP et
# worker : installation + enrôlement Tailscale, PUIS fermeture publique
# des ports cluster. La bascule kubeconfig (127.0.0.1 -> IP tailnet),
# autrefois ici, est déplacée dans le rôle k3s_server (le kubeconfig
# n'existe qu'après l'installation k3s = phase 2), qui redécouvre aussi
# l'IP Tailscale effective (PRA).
# Correctif du 25/10 (CHG-2026-10-20) conservé : activation EXPLICITE
# d'UFW (state: enabled) — le worker était resté avec des règles posées
# sur un pare-feu INACTIF pendant 5 jours.
# V5 : l'enrôlement utilise node_hostname (convention de nommage) —
# le nom MagicDNS = hostname système = futur nom de nœud k3s.

# -------------------------
# CONTRÔLE PRÉALABLE
# -------------------------

- name: Vérifier que l'authkey Tailscale est fournie
  ansible.builtin.assert:
    that:
      - tailscale_auth_key | length > 0
    fail_msg: >-
      tailscale_auth_key manquant. Fournir via --extra-vars :
      -e tailscale_auth_key=tskey-auth-xxxx (jamais dans Git).

# -------------------------
# INSTALLATION + ENRÔLEMENT
# -------------------------

- name: Vérifier si Tailscale est installé
  ansible.builtin.command: which tailscale
  register: tailscale_bin
  failed_when: false
  changed_when: false

- name: Installer Tailscale
  ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
  when: tailscale_bin.rc != 0

- name: Vérifier si le nœud est déjà enrôlé
  ansible.builtin.command: tailscale status
  register: tailscale_status
  failed_when: false
  changed_when: false

- name: "Enrôler le nœud dans le tailnet (no_log : authkey jamais journalisée)"
  ansible.builtin.command: >
    tailscale up
    --auth-key={{ tailscale_auth_key }}
    --hostname={{ node_hostname | default(inventory_hostname) }}
    --accept-dns=false
  when: tailscale_status.rc != 0
  no_log: true

- name: Attendre l'interface tailscale0
  ansible.builtin.wait_for:
    path: /sys/class/net/tailscale0
    state: present
    timeout: 60

- name: Récupérer l'IP Tailscale du nœud
  ansible.builtin.command: tailscale ip -4
  register: tailscale_ip
  until: tailscale_ip.stdout | length > 0
  retries: 10
  delay: 5
  changed_when: false

# -------------------------
# FERMETURE PUBLIQUE DES PORTS CLUSTER
# -------------------------

- name: Autoriser tout le trafic entrant sur l'interface tailscale0
  community.general.ufw:
    rule: allow
    direction: in
    interface: tailscale0

- name: Refuser publiquement l'API Kubernetes (6443/tcp)
  community.general.ufw:
    rule: deny
    port: '6443'
    proto: tcp

- name: Refuser publiquement kubelet (10250/tcp)
  community.general.ufw:
    rule: deny
    port: '10250'
    proto: tcp

- name: Refuser publiquement flannel VXLAN (8472/udp)
  community.general.ufw:
    rule: deny
    port: '8472'
    proto: udp

- name: Activer UFW (règles appliquées + persistance au démarrage)
  community.general.ufw:
    state: enabled

- name: Recharger UFW
  community.general.ufw:
    state: reloaded
