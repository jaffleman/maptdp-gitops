- name: Ensure namespace exists
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: maptdp

- name: Create Vault AppRole secret
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: vault-approle-token
        namespace: maptdp
      type: Opaque
      stringData:
        secret-id: "{{ vault_secret_id }}"

- name: Get Docker Hub credentials from Vault
  command: vault kv get -format=json k3s/dockerhub
  register: dockerhub_secret_raw
  delegate_to: localhost
  become: false
  environment:
    VAULT_ADDR: "https://vault.jaffleman.tech:8200"

- name: Extract Docker Hub credentials
  set_fact:
    dockerhub_username: "{{ (dockerhub_secret_raw.stdout | from_json).data.data.username }}"
    dockerhub_password: "{{ (dockerhub_secret_raw.stdout | from_json).data.data.password }}"

- name: Create Docker Hub pull secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: dockerhub-secret
        namespace: argocd
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {{ {
              "auths": {
                "https://index.docker.io/v1/": {
                  "username": dockerhub_username,
                  "password": dockerhub_password,
                  "auth": (dockerhub_username + ":" + dockerhub_password) | b64encode
                }
              }
            } | to_json | b64encode }}
