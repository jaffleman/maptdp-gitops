# V3 - Correctifs TECH-01 (audit du 2026-10-23) :
#   - C7  : secrets-encryption activé AVANT l'installation k3s
#           (/etc/rancher/k3s/config.yaml) + contrôle post-installation
#   - C8  : /etc/rancher/k3s/k3s.yaml en 0600 (était 0644)
#   - C9  : la copie kubeconfig était un no-op : le playbook définissait
#           kubeconfig_path = /etc/rancher/k3s/k3s.yaml (src = dest).
#           Le var est supprimé du playbook : la copie réelle
#           /etc/rancher/k3s/k3s.yaml -> {{ kubeconfig_path }} (0600,
#           utilisateur {{ kube_user }}) fonctionne désormais.
#   - C10 : la bascule 127.0.0.1 -> IP publique est SUPPRIMÉE : le
#           kubeconfig est basculé vers l'IP Tailscale par le rôle
#           tailscale_ufw, APRÈS validation du tailnet (anti-lockout).
#   - C19 : tls-san ajouté avec l'IP Tailscale du control-plane. Sans
#           lui, le certificat serving de l'API n'inclut pas l'IP du
#           tailnet et TOUTE validation TLS via tailnet échoue (kubectl
#           via kubeconfig basculé, TokenReview Vault/VSO). Constat
#           issu de l'incident du 24/10/2026 : auth kubernetes Vault
#           en 403 car le TokenReview vers l'IP tailnet échouait en
#           vérification de certificat (SAN manquant).
#           NOTE PRA : si le VPS1 réenrôlé reçoit une IP Tailscale
#           différente de {{ k3s_control_plane_ip }}, le rôle
#           tailscale_ufw doit mettre à jour tls-san et faire
#           régénérer le certificat (restart k3s) AVANT la bascule
#           kubeconfig.
#   - C20 (25/10/2026, incident CHG-2026-10-20-TAILNET-VSO) :
#           node-ip + flannel-iface ajoutés au config.yaml. Sans eux,
#           le nœud publie son IP publique et la fermeture UFW
#           inter-nœuds partitionne le cluster. État aligné sur le
#           config.yaml VPS1 complété à chaud le 25/10 (validé :
#           ping CP->worker 3/3, VSO 12/12 SYNCED).

# -------------------------
# PRÉ-REQUIS
# -------------------------

- name: Créer le répertoire de configuration k3s
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

# V3 (C7) : écrit AVANT l'installation pour que k3s démarre directement
# avec le chiffrement des secrets etcd (pas de redémarrage requis).
# V3 (C19) : tls-san = IP Tailscale du control-plane pour que le
# certificat serving de l'API couvre l'accès via le tailnet.
# V3 (C20) : node-ip + flannel-iface = le nœud (et flannel) s'annoncent
# sur l'IP du tailnet, jamais sur l'IP publique.
- name: Épingler k3s sur le tailnet (secrets-encryption, tls-san, node-ip, flannel-iface)
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: '0600'
    content: |
      secrets-encryption: true
      tls-san:
        - "{{ k3s_control_plane_ip }}"
      node-ip: "{{ k3s_control_plane_ip }}"
      flannel-iface: tailscale0
  register: k3s_server_config

# -------------------------
# INSTALLATION K3S
# -------------------------

- name: Télécharger script d'installation k3s
  get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s_install.sh
    mode: '0755'

- name: Installer k3s sans Traefik
  shell: |
    INSTALL_K3S_EXEC="--disable=traefik" sh /tmp/k3s_install.sh
  args:
    creates: /usr/local/bin/k3s

# V3 (C20) : sur un re-run (PRA ou config modifiée), la modification
# de config.yaml ne prend effet qu'après restart de k3s. Le config.yaml
# du VPS1 de prod est déjà conforme (complété à chaud le 25/10) ->
# pas de restart lors du prochain run.
- name: Redémarrer k3s si la configuration a changé (re-runs)
  ansible.builtin.systemd:
    name: k3s
    state: restarted
  when: k3s_server_config is changed

# -------------------------
# ATTENTE DU CLUSTER
# -------------------------

- name: Attendre que le node k3s soit ready
  shell: k3s kubectl get nodes
  register: k3s_status
  retries: 10
  delay: 5
  until: k3s_status.rc == 0

# V3 (C7) : contrôle que le chiffrement des secrets est bien actif.
- name: Vérifier que le chiffrement des secrets est actif
  command: k3s secrets-encrypt status
  register: secrets_encrypt_status
  changed_when: false
  failed_when: secrets_encrypt_status.rc != 0 or 'disabled' in (secrets_encrypt_status.stdout | lower)

# -------------------------
# KUBECONFIG
# -------------------------

- name: Créer dossier .kube pour l'utilisateur
  file:
    path: "/home/{{ kube_user }}/.kube"
    state: directory
    owner: "{{ kube_user }}"
    mode: '0755'

- name: Copier kubeconfig pour l'utilisateur
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ kubeconfig_path }}"
    owner: "{{ kube_user }}"
    mode: '0600'
    remote_src: true

# V3 (C8) : le kubeconfig serveur contient les credentials admin du
# cluster : 0644 était trop permissif.
- name: Restreindre les permissions du kubeconfig serveur (0600)
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: '0600'

# -------------------------
# EXPORT KUBECONFIG
# -------------------------

- name: Ajouter KUBECONFIG dans le bashrc
  lineinfile:
    path: "/home/{{ kube_user }}/.bashrc"
    line: "export KUBECONFIG={{ kubeconfig_path }}"
    create: yes

# -------------------------
# VALIDATION
# -------------------------

- name: Vérifier accès cluster
  become_user: "{{ kube_user }}"
  shell: kubectl get nodes
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
