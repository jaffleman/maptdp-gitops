# V3 - Nouveau rôle (TECH-01) : agent k3s sur le worker.
# Le token est fourni via --extra-vars (jamais dans Git) :
#   sudo cat /var/lib/rancher/k3s/server/node-token   (sur le control-plane)
#   -e k3s_token=K10xxxx
# L'URL du control-plane utilise l'IP Tailscale (6443 non public).
#
# Correctif du 25/10/2026 (incident CHG-2026-10-20-TAILNET-VSO) :
# l'agent enrôlé le 20/10 sans node-ip/flannel-iface publiait son IP
# PUBLIQUE ; la fermeture UFW inter-nœuds a alors partitionné le
# cluster (CP->worker 10250 KO, flannel inter-nœuds coupé, VSO et
# dumps PG en échec). Le config.yaml est désormais écrit AVANT
# l'installation de l'agent — état aligné sur la réparation manuelle
# validée le 25/10 (config.yaml worker : node-ip + flannel-iface).

# -------------------------
# CONTRÔLE PRÉALABLE
# -------------------------

- name: Vérifier que le token k3s et l'IP du control-plane sont fournis
  ansible.builtin.assert:
    that:
      - k3s_token | length > 0
      - k3s_control_plane_ip | length > 0
    fail_msg: >-
      k3s_token manquant (--extra-vars) et/ou k3s_control_plane_ip
      absent de group_vars/all.yml.

# -------------------------
# CONFIGURATION RÉSEAU DE L'AGENT (avant installation)
# -------------------------

- name: Récupérer l'IP Tailscale du worker
  ansible.builtin.command: tailscale ip -4
  register: worker_tailscale_ip
  changed_when: false

- name: Créer le répertoire de configuration k3s
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

- name: Épingler l'agent sur le tailnet (node-ip + flannel-iface)
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: '0600'
    content: |
      node-ip: {{ worker_tailscale_ip.stdout | trim }}
      flannel-iface: tailscale0
  register: k3s_worker_config

# -------------------------
# INSTALLATION K3S (AGENT)
# -------------------------

- name: Vérifier si k3s est déjà installé
  ansible.builtin.command: which k3s
  register: k3s_bin
  failed_when: false
  changed_when: false

- name: Télécharger script d'installation k3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s_install.sh
    mode: '0755'
  when: k3s_bin.rc != 0

- name: Installer l'agent k3s (rejoint le control-plane via le tailnet)
  ansible.builtin.shell: |
    INSTALL_K3S_EXEC="agent" \
    K3S_URL="https://{{ k3s_control_plane_ip }}:6443" \
    K3S_TOKEN="{{ k3s_token }}" \
    K3S_NODE_NAME="{{ k3s_node_name }}" \
    sh /tmp/k3s_install.sh
  args:
    creates: /usr/local/bin/k3s
  no_log: true

- name: Activer et démarrer l'agent k3s
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true

# Correctif du 25/10/2026 : sur un re-run (worker déjà enrôlé), la
# modification de config.yaml ne prend effet qu'après restart de
# l'agent. Le worker de prod est déjà conforme (appliqué à chaud le
# 25/10) -> pas de restart lors du prochain run.
- name: Redémarrer l'agent si la configuration a changé (re-runs)
  ansible.builtin.systemd:
    name: k3s-agent
    state: restarted
  when: k3s_worker_config is changed

# -------------------------
# ATTENTE VUE DU CONTROL-PLANE
# -------------------------

- name: Attendre que le nœud soit Ready vu du control-plane
  ansible.builtin.command: >
    k3s kubectl get node {{ k3s_node_name }}
    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: worker_ready
  delegate_to: "{{ groups['k3s_servers'][0] }}"
  become: true
  changed_when: false
  until: worker_ready.stdout == "True"
  retries: 30
  delay: 10

- name: Labeliser le nœud en worker
  ansible.builtin.command: >
    k3s kubectl label node {{ k3s_node_name }}
    node-role.kubernetes.io/worker=worker --overwrite
  delegate_to: "{{ groups['k3s_servers'][0] }}"
  become: true
  changed_when: false
