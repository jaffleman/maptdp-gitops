- name: "C06 - Vérifier que root_app_dir est présent (relatif au playbook)"
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../root_app_dir"
  delegate_to: localhost
  become: false
  register: root_app_dir_check
  failed_when: not root_app_dir_check.stat.exists

- name: "C10 - Attendre le rollout complet du serveur ArgoCD"
  ansible.builtin.import_role:
    name: readiness_wait
  vars:
    readiness_kind: deployment
    readiness_name: argocd-server
    readiness_namespace: argocd
    readiness_kubeconfig: "{{ kubeconfig_path }}"
    readiness_timeout: "{{ readiness_deployment_timeout }}"
  tags: [argocd_ready]

- name: Deploy ArgoCD Single Root Application (Bootstrap)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition: "{{ lookup('file', playbook_dir ~ '/../root_app_dir/root-appv2.yaml') | from_yaml }}"

- name: "C10 - Attendre root-appv2 Synced et Healthy"
  ansible.builtin.import_role:
    name: readiness_wait
  vars:
    readiness_kind: application
    readiness_name: root-appv2
    readiness_namespace: argocd
    readiness_kubeconfig: "{{ kubeconfig_path }}"
    readiness_timeout: "{{ readiness_argocd_timeout }}"
  tags: [argocd_ready]

- name: Deploy ArgoCD root-app-maptdp-dev.yaml (Bootstrap)
  kubernetes.core.k8s:
