# -------------------------
# WAIT TRAEFIK READY
# -------------------------

- name: Wait for Traefik to be ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: traefik
    kubeconfig: "{{ kubeconfig_path }}"
  become: true
  register: traefik_pods
  retries: 15
  delay: 5
  until: >
    traefik_pods.resources | length > 0 and
    (
      traefik_pods.resources |
      selectattr('status.containerStatuses', 'defined') |
      map(attribute='status.containerStatuses') |
      map('first') |
      map(attribute='ready') |
      list
    ) | min

# -------------------------
# CLEANUP
# -------------------------

- name: Supprimer le job helm résiduel cert-manager (si présent)
  shell: k3s kubectl delete job helm-delete-cert-manager -n kube-system --ignore-not-found
  changed_when: false

# -------------------------
# DEPLOIEMENT CERT-MANAGER (HELM PROPRE)
# -------------------------

- name: Add Jetstack Helm repo
  ansible.builtin.command:
    cmd: helm repo add jetstack https://charts.jetstack.io
  register: repo_add
  failed_when: false
  changed_when: "'already exists' not in repo_add.stderr"

- name: Update Helm repos
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false

- name: Install cert-manager
  ansible.builtin.command:
    cmd: >
      helm upgrade --install cert-manager jetstack/cert-manager
      --namespace {{ cert_manager_namespace }}
      --create-namespace
      --version v1.14.5
      --set installCRDs=true
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: cert_manager_install

# -------------------------
# WAIT CRDs (CRUCIAL)
# -------------------------

- name: Wait for cert-manager CRDs
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: certificates.cert-manager.io
    kubeconfig: "{{ kubeconfig_path }}"
  become: true
  register: crd_check
  retries: 15
  delay: 5
  until: crd_check.resources | length > 0

# -------------------------
# ATTENTE NAMESPACE
# -------------------------

- name: Wait namespace cert-manager
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ cert_manager_namespace }}"
    kubeconfig: "{{ kubeconfig_path }}"
  become: true
  register: cert_manager_ns
  retries: "{{ cert_manager_wait_retries }}"
  delay: "{{ cert_manager_wait_delay }}"
  until: cert_manager_ns.resources | length > 0

# -------------------------
# ATTENTE DEPLOYMENT
# -------------------------

- name: Wait cert-manager deployment
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: cert-manager
    namespace: "{{ cert_manager_namespace }}"
    kubeconfig: "{{ kubeconfig_path }}"
  become: true
  register: cert_manager_deploy
  retries: "{{ cert_manager_wait_retries }}"
  delay: "{{ cert_manager_wait_delay }}"
  until: cert_manager_deploy.resources | length > 0

# -------------------------
# ATTENTE PODS READY
# -------------------------

- name: Wait cert-manager pods ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ cert_manager_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=cert-manager
    kubeconfig: "{{ kubeconfig_path }}"
  become: true
  register: cert_manager_pods
  retries: "{{ cert_manager_wait_retries }}"
  delay: "{{ cert_manager_wait_delay }}"
  until: >
    cert_manager_pods.resources | length > 0 and
    (
      cert_manager_pods.resources |
      selectattr('status.containerStatuses', 'defined') |
      map(attribute='status.containerStatuses') |
      map('first') |
      map(attribute='ready') |
      list
    ) | min

# -------------------------
# VALIDATION
# -------------------------

- name: Show cert-manager pods
  debug:
    var: cert_manager_pods.resources
