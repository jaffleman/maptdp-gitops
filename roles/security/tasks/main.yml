# V5 (29/10) — Rôle de DURCISSEMENT uniquement : sshd_config (le Port
# {{ ssh_port }} est ÉCRIT mais prendra effet au reboot de fin de phase 1),
# UFW, fail2ban. La bascule effective (socket systemd + reboot) est portée
# par les post_tasks de playbooks/prepare_vps.yml (phase 1) : c'est le BOOT
# qui applique le nouveau port — plus aucune reconnexion Ansible en cours
# de run, plus de set_fact/reset_connection/garde-fou.
# Conserve les correctifs V3 : C2 (gestion explicite du 22), C3 (purge
# known_hosts templatisée), C13 (ignoreip en variable).
# Conserve les correctifs V4 : fail2ban idempotent (copy), filet 22 temporaire.

# -------------------------
# PRÉ-REQUIS
# -------------------------

- name: Mettre à jour le cache APT
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer les paquets de sécurité
  apt:
    name:
      - ufw
      - fail2ban
    state: present

# -------------------------
# SSH HARDENING (configuration — effet au reboot de fin de phase 1)
# -------------------------

- name: Désactiver l'authentification par mot de passe SSH
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    backup: yes

- name: Interdire le login root en SSH
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'

- name: Activer l'authentification par clé SSH
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PubkeyAuthentication'
    line: 'PubkeyAuthentication yes'

- name: Définir le port SSH proprement
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Port '
    line: "Port {{ ssh_port }}"
    insertafter: '^#Port 22'
    validate: 'sshd -t -f %s'
  register: ssh_port_change

- name: Désactiver X11 forwarding
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?X11Forwarding'
    line: 'X11Forwarding no'

- name: Désactiver agent forwarding
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?AllowAgentForwarding'
    line: 'AllowAgentForwarding no'

- name: Restreindre l'accès SSH à un utilisateur
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^AllowUsers'
    line: "AllowUsers {{ ssh_user }}"

- name: Vérifier la syntaxe de la configuration SSH
  command: sshd -t
  register: sshd_check
  failed_when: sshd_check.rc != 0
  changed_when: false

# -------------------------
# V3 (C3) : PURGE KNOWN_HOSTS AVANT TOUT CONTACT (accept-new ansible.cfg)
# -------------------------

- name: Purger l'entrée known_hosts [IP]:22 (premier contact)
  ansible.builtin.command: >
    ssh-keygen -f "~/.ssh/known_hosts"
    -R "[{{ ansible_host | default(inventory_hostname) }}]:22"
  delegate_to: localhost
  become: false
  failed_when: false
  changed_when: false

- name: Purger l'entrée known_hosts [IP]:{{ ssh_port }} (runs précédents)
  ansible.builtin.command: >
    ssh-keygen -f "~/.ssh/known_hosts"
    -R "[{{ ansible_host | default(inventory_hostname) }}]:{{ ssh_port }}"
  delegate_to: localhost
  become: false
  failed_when: false
  changed_when: false

# -------------------------
# FIREWALL UFW
# -------------------------

- name: Reset UFW (nettoyage complet)
  ufw:
    state: reset

- name: Configurer la politique par défaut (Entrée refusée)
  ufw:
    direction: incoming
    policy: deny

- name: Configurer la politique par défaut (Sortie autorisée)
  ufw:
    direction: outgoing
    policy: allow

- name: Autoriser le NOUVEAU port SSH dans le pare-feu
  ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp

- name: Limiter les tentatives sur le nouveau port SSH (anti brute-force)
  ufw:
    rule: limit
    port: "{{ ssh_port }}"
    proto: tcp

# V3 (C2) : filet de sécurité temporaire. Il couvre la fenêtre avant le
# reboot de fin de phase 1 (sshd encore sur 22). Supprimé par les
# post_tasks de prepare_vps.yml AVANT le reboot.
- name: Autorisation TEMPORAIRE du port 22 (filet de bascule)
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    comment: TEMPORAIRE - supprimee avant le reboot

- name: Autoriser les ports publics nécessaires (HTTP/HTTPS)
  ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop: "{{ ufw_allowed_ports }}"

- name: Activer les logs UFW
  ufw:
    logging: on

- name: Forcer l'écriture et la persistance des règles UFW
  command: ufw reload
  changed_when: false

- name: Activer UFW
  ufw:
    state: enabled

# -------------------------
# FAIL2BAN
# -------------------------

- name: Créer la configuration fail2ban locale (idempotent V4)
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    content: |
      [DEFAULT]
      ignoreip = {{ fail2ban_ignoreip }}

      [sshd]
      enabled = true
      port = {{ ssh_port }}
      backend = systemd
      maxretry = {{ fail2ban_maxretry }}
      findtime = {{ fail2ban_findtime }}
      bantime = {{ fail2ban_bantime }}

- name: "Attendre 30 secondes que le système et le réseau se stabilisent"
  ansible.builtin.pause:
    seconds: 30

- name: Redémarrer fail2ban
  systemd:
    name: fail2ban
    state: restarted
    enabled: true
