# -------------------------
# PRÉ-REQUIS
# -------------------------

- name: Mettre à jour le cache APT
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer les paquets de sécurité
  apt:
    name:
      - ufw
      - fail2ban
    state: present

