- name: Add HashiCorp Helm repo
  kubernetes.core.helm_repository:
    name: hashicorp
    repo_url: "https://helm.releases.hashicorp.com"

- name: Install / Upgrade Vault Secrets Operator
  kubernetes.core.helm:
    name: vault-secrets-operator
    chart_ref: hashicorp/vault-secrets-operator
    release_namespace: kube-system
    create_namespace: true
    chart_version: "{{ vault_secrets_chart_version }}"
    kubeconfig: "{{ kubeconfig_path }}"
    values:
      controller:
        create: true
      # On écrase l'image morte par le nouveau registre officiel de Kubernetes
      kubeRbacProxy:
        image:
          repository: registry.k8s.io/kubebuilder/kube-rbac-proxy
          tag: v0.15.0

- name: "C10 - Attendre le rollout complet du Deployment VSO"
  ansible.builtin.import_role:
    name: readiness_wait
  vars:
    readiness_kind: deployment
    readiness_name: vault-secrets-operator-controller-manager
    readiness_namespace: kube-system
    readiness_kubeconfig: "{{ kubeconfig_path }}"
    readiness_timeout: "{{ readiness_deployment_timeout }}"
  tags: [vso_ready]

