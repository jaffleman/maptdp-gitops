# V3 - Correctifs TECH-01 (audit du 2026-10-23) :
#   - C4  : la tâche debug qui affichait le client_token est SUPPRIMÉE
#           (le token transitait en clair dans la sortie console et
#           phoenix.log) ; no_log ajouté sur le login AppRole.
#   - C11 : kubernetes_host ne cible plus l'IP publique codée en dur
#           (146.59.231.136:6443) mais l'IP Tailscale du control-plane
#           ({{ k3s_control_plane_ip }}), le 6443 n'étant plus exposé
#           au public (C1).
#   - slurp du CA : become: true explicite (la lecture exige root).
# Bascule du 24/10/2026 : l'URL Vault ne cible plus le https public
# (https://vault.jaffleman.tech, cassé par la panne Freebox du 20/10)
# mais {{ vault_addr }} (group_vars/all.yml), accès Vault via le
# tailnet chiffré WireGuard.

- name: "Vault : Authentification temporaire via AppRole"
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ vault_ansible_role_id }}"
      secret_id: "{{ vault_ansible_secret_id }}"
  register: vault_login
  no_log: true
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false

- name: Récupérer le certificat CA depuis le VPS distant
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/tls/server-ca.crt
  register: k3s_ca_encoded
  become: true

- name: "Vault : Mise à jour automatique du CA K3s"
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/kubernetes/config"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_login.json.auth.client_token }}"
    body_format: json
    body:
      kubernetes_host: "https://{{ k3s_control_plane_ip }}:6443"
      disable_iss_validation: true
      disable_local_ca_jwt: true
      kubernetes_ca_cert: "{{ k3s_ca_encoded['content'] | b64decode }}"
    status_code: [200, 204]
  delegate_to: localhost
  connection: local
  become: false
  vars:
    ansible_become: false
