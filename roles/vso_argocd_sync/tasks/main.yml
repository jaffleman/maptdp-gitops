        namespace: argocd
      spec:
        vaultAuthRef: vault-jwt-auth
        mount: k3s
        path: maptdp/github/maptdp-frontend
        type: kv-v2
        refreshAfter: 5m

        destination:
          name: argocd-repo-frontend
          create: true
          overwrite: true

          labels:
            argocd.argoproj.io/secret-type: repository



- name: "VSO App : Configure VaultStaticSecret to generate image-updater-auth database"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: secrets.hashicorp.com/v1beta1
