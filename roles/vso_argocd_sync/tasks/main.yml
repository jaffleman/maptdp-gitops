# -------------------------
# Restart Image Updater
# -------------------------

- name: "Restart ArgoCD Image Updater"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: patched
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-image-updater
        namespace: argocd
      spec:
        template:
          metadata:
            annotations:
              restarted-at: "{{ ansible_date_time.iso8601 }}"