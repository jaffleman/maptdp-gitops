apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-jwt-auth
  namespace: maptdp-prod
spec:
  vaultConnectionRef: vault-connection-maptdp
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: maptdp-prod-db-reader
    serviceAccount: vso-app-sa
    audiences:
    - vault
    - https://kubernetes.default.svc.cluster.local
    - k3s
