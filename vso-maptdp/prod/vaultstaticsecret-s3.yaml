apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: postgres-s3-sync
  namespace: maptdp-prod
spec:
  vaultAuthRef: vault-jwt-auth
  mount: k3s
  path: vso-maptdp/prod/s3
  type: kv-v2
  destination:
    name: postgres-s3-auth-vso
    create: true
    transformation:
      excludeRaw: true
  refreshAfter: 60s
