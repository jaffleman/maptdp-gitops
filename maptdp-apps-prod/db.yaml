apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maptdp-db-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jaffleman/maptdp-gitops.git
    targetRevision: prod
    path: charts/maptdp-db
    helm:
      valueFiles:
      - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: maptdp-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
