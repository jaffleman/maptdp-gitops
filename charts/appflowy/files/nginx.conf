pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  log_format safe '$remote_addr $request_method $status';
  access_log /dev/stdout safe;
  error_log /dev/stderr warn;
  server {
    listen 8080;
    client_max_body_size 256m;
    underscores_in_headers on;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Connection "";
    proxy_read_timeout 3600s;
    location = /healthz { access_log off; return 200 'ok'; }
    location = /gotrue { return 308 /gotrue/; }
    location /gotrue/ { proxy_pass http://appflowy-gotrue:9999/; }
    location /ws {
      proxy_pass http://appflowy-cloud:8000;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api { proxy_pass http://appflowy-cloud:8000; proxy_buffering off; }
    location /console { proxy_pass http://appflowy-admin:3000; }
    location /minio-api/ {
      proxy_pass http://appflowy-minio:9000/;
      proxy_set_header Host appflowy-minio:9000;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_request_buffering off;
      proxy_buffering off;
    }
    location /minio/ { return 404; }
    location /scim { return 404; }
    location / { proxy_pass http://appflowy-web:80; }
  }
}
