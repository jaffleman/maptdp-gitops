apiVersion: v1
kind: ServiceAccount
metadata:
  name: appflowy-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: appflowy-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.credentials.secretName | quote }}]
    verbs: [get]
  # Kubernetes cannot constrain the name of a create request through resourceNames.
  # The bootstrap service account has no update, patch, delete, list or cluster rights.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: appflowy-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: appflowy-bootstrap
subjects:
  - kind: ServiceAccount
    name: appflowy-bootstrap
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: appflowy-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  bootstrap.py: |
{{ .Files.Get "files/bootstrap.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: appflowy-credentials-bootstrap-v1
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: appflowy-bootstrap
    spec:
      serviceAccountName: appflowy-bootstrap
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: generate
          image: {{ .Values.credentials.bootstrapImage | quote }}
          command: [python, /scripts/bootstrap.py]
          env:
            - name: SECRET_NAME
              value: {{ .Values.credentials.secretName | quote }}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: appflowy-bootstrap
