global:
  domain: appflowy-preprod.jaffleman.tech
  scheme: https
  wsScheme: wss
  imageRegistry: ''
  imagePullSecrets: []
  labels: {}
  annotations: {}
  postgresql:
    host: appflowy-postgresql
    port: 5432
    database: postgres
    username: postgres
    password: ''
    existingSecret: appflowy-credentials
    secretKeys:
      password: postgres-password
  redis:
    host: appflowy-redis
    port: 6379
    password: ''
    existingSecret: appflowy-credentials
    secretKeys:
      password: redis-password
  s3:
    useMinio: true
    endpoint: appflowy-minio
    port: 9000
    bucket: appflowy
    region: us-east-1
    createBucket: true
    accessKey: ''
    secretKey: ''
    existingSecret: appflowy-credentials
    secretKeys:
      accessKey: root-user
      secretKey: root-password
    presignedUrlEndpoint: https://appflowy-preprod.jaffleman.tech/minio-api
  jwt:
    secret: ''
    existingSecret: appflowy-credentials
    secretKey: jwt-secret
    expiration: 604800
postgresql:
  enabled: false
  image:
    registry: docker.io
    repository: pgvector/pgvector
    tag: pg16
    digest: sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
  auth:
    postgresPassword: ''
    database: postgres
  primary:
    podSecurityContext:
      fsGroup: 999
    containerSecurityContext:
      runAsUser: 999
      runAsGroup: 999
      readOnlyRootFilesystem: false
    extraEnvVars:
    - name: POSTGRES_DB
      value: '{{ .Values.auth.database }}'
    customLivenessProbe:
      exec:
        command:
        - sh
        - -ec
        - pg_isready -h 127.0.0.1 -U "${POSTGRES_USER:-postgres}" -d "$POSTGRES_DB"
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
    customReadinessProbe:
      exec:
        command:
        - sh
        - -ec
        - pg_isready -h 127.0.0.1 -U "${POSTGRES_USER:-postgres}" -d "$POSTGRES_DB"
      periodSeconds: 5
      timeoutSeconds: 5
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ''
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 500m
    initdb:
      scripts:
        init-extensions.sql: 'CREATE EXTENSION IF NOT EXISTS vector;

          CREATE EXTENSION IF NOT EXISTS pg_trgm;

          '
redis:
  enabled: false
  image:
    tag: latest
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ''
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 200m
minio:
