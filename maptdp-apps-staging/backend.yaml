apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maptdp-backend-staging
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/jaffleman/maptdp-gitops.git
    targetRevision: staging
    path: charts/maptdp-backend

    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: maptdp-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
